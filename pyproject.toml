[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-tile"
version = "0.1.0"
description = "A Rubik-like puzzle on an infinite periodic hexagonal plane"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
magic-tile = "magic_tile.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
